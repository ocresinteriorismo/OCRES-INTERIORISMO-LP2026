:root {
  --lino: #F2ECE2;
  --papel: #FBF8F3;
  --tinta: #3A2A20;        /* marrón oscuro */
  --tinta-suave: #7A6656;
  --ocre: #B8862F;          /* ocre dorado */
  --terracota: #A85A3C;
  --salvia: #8C9A7E;
  --linea: #D9CDBB;
  --display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --texto: "Jost", "Futura", "Century Gothic", "Avenir", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lino: #1F1914; --papel: #26201A; --tinta: #F1E8DA; --tinta-suave: #B8A792;

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lino: #1F1914; --papel: #26201A; --tinta: #F1E8DA; --tinta-suave: #B8A792;
  --ocre: #D6A856; --terracota: #D98A69; --salvia: #A9B79B; --linea: #4A3D31;
  color-scheme: dark;
}
body {
  background: var(--lino);
  color: var(--tinta);
  font-family: var(--texto);
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.carta {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 36px;
}
header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.marca {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(44px, 13vw, 64px);
  letter-spacing: 0.04em;
  line-height: 0.95;
  margin: 0;
}
.sub {
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--tinta-suave);
  margin: 0;
}
.evento {
  margin-top: 14px;
  padding: 12px 18px;
  border-top: 1px solid var(--linea);
  border-bottom: 1px solid var(--linea);
  display: flex; flex-direction: column; gap: 2px;
}
.evento strong { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 22px; color: var(--terracota); }
.evento span { font-size: 12.5px; color: var(--tinta-suave); letter-spacing: 0.02em; }

nav.indice { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; }
nav.indice a {
  font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tinta); text-decoration: none; padding: 6px 2px;
  border-bottom: 1px solid transparent;
}
nav.indice a:hover, nav.indice a:focus-visible { border-bottom-color: var(--ocre); outline: none; }

section { display: flex; flex-direction: column; gap: 4px; scroll-margin-top: 20px; }
section h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 32px;
  margin: 0 0 6px;
  display: flex; align-items: center; gap: 14px;
  text-wrap: balance;
}
section h2::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
.item { padding: 12px 0; border-bottom: 1px dotted var(--linea); display: flex; flex-direction: column; gap: 3px; }
.item:last-child { border-bottom: 0; }
.fila { display: flex; align-items: baseline; gap: 10px; }
.nombre { font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.15; min-width: 0; }
.variante { font-style: italic; font-weight: 400; color: var(--tinta-suave); }
.puntos { flex: 1; border-bottom: 1px dotted var(--tinta-suave); opacity: 0.45; transform: translateY(-5px); min-width: 16px; }
.precio { font-family: var(--texto); font-weight: 500; font-size: 15.5px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--tinta); }
.detalle { font-size: 13px; color: var(--tinta-suave); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.detalle .nota { color: var(--terracota); }

footer { text-align: center; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--linea); }
footer p { margin: 0; font-size: 12.5px; color: var(--tinta-suave); }
footer .firma { font-family: var(--display); font-style: italic; font-size: 19px; color: var(--ocre); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

function partir(nombre) {
  // "Lámpara Glimmering · malbec" -> familia + variante; se quitan los tramos que repiten medidas ("Ø 60 cm", "120 × 40 cm").
  const partes = nombre.split(" · ").filter(p => !/\bcm\b|\bml\b|^\d+([.,]\d+)?\s*×\s*\d+/.test(p));
  return { familia: partes[0] || nombre, variante: partes.slice(1).join(" · ") };

function agrupar(lista) {
  const out = [], idx = {};
  lista.forEach(it => {
    if (!AGRUPAR.includes(it.cat)) { out.push(it); return; }
    const { familia, variante } = partir(it.nombre);
    const k = [familia, it.medidas, it.precio, it.nota].join("|");

    if (!UNIR_COLORES.includes(it.cat)) { out.push(it); return; }
    const { familia, variante } = partir(it.nombre);
    const k = [it.cat, familia, it.medidas, it.nota, num(it.precio)].join("|");
    if (idx[k] == null) { idx[k] = out.length; out.push({ base: it, familia, items: [] }); }
    out[idx[k]].items.push({ variante, precio: it.precio });
  });
  return out.map(g => {
    if (!g.items) return g;
    if (g.items.length === 1) return g.base;
    const min = g.items.reduce((m, x) => num(x.precio) < num(m.precio) ? x : m);
    const todosIgual = g.items.every(x => num(x.precio) === num(min.precio));
    return { ...g.base, nombre: g.familia, mix: true, familia: g.familia,
      precio: todosIgual ? min.precio : "desde " + min.precio,
      colores: g.items.map(x => x.variante + (num(x.precio) === num(min.precio) ? "" : " (" + x.precio + ")")) };
  });
}

const grupos = {};
// Dentro de cada categoría: orden alfabético, con los colgantes juntos al principio.
const esColgante = it => /colgante/i.test(it.nombre) ? 0 : 1;
unirColores(agrupar(ITEMS)).sort((a, b) => (esColgante(a) - esColgante(b)) || a.nombre.localeCompare(b.nombre, "es", { numeric: true, sensitivity: "base" })).forEach(it => { (grupos[it.cat] = grupos[it.cat] || []).push(it); });
const cats = Object.keys(grupos).sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));

const indice = document.getElementById("indice");
const carta = document.getElementById("carta");
cats.forEach(cat => {
  const a = el("a", null, cat); a.href = "#" + slug(cat); indice.appendChild(a);
  const sec = el("section"); sec.id = slug(cat);
  sec.appendChild(el("h2", null, cat));
  grupos[cat].forEach(it => {
    let { familia, variante } = it.mix ? { familia: it.familia, variante: "" } : it.familia ? { familia: it.familia, variante: it.medidaTitulo } : partir(it.nombre);
    const item = el("div", "item");
    const fila = el("div", "fila");
    const n = el("span", "nombre", familia);
    if (variante) { n.appendChild(document.createTextNode(" ")); n.appendChild(el("span", "variante", variante)); }
    fila.append(n, el("span", "puntos"), el("span", "precio", it.precio));
    item.appendChild(fila);
    if (it.mix) {
      const d = el("div", "detalle");
      if (it.medidas) d.appendChild(el("span", null, it.medidas));
      d.appendChild(el("span", null, "Colores: " + it.colores.join(", ")));
      if (it.nota) d.appendChild(el("span", "nota", it.nota));
      item.appendChild(d);
    } else if (it.opciones) {
      if (it.opciones.length) {
        const d = el("div", "detalle");
        d.appendChild(el("span", null, (it.cat === "Fragancias" ? "Aromas: " : /cubre/i.test(familia) ? "Colores: " : it.opciones.length > 1 ? "Opciones: " : "Versión: ") + it.opciones.join(", ")));
        if (it.nota) d.appendChild(el("span", "nota", it.nota));
        item.appendChild(d);
      }
    } else if (it.medidas || it.nota) {
      const d = el("div", "detalle");
      if (it.medidas) d.appendChild(el("span", null, it.medidas));
      if (it.nota) d.appendChild(el("span", "nota", it.nota));
      item.appendChild(d);
    }
    sec.appendChild(item);
  });
  carta.appendChild(sec);
});
</script>
